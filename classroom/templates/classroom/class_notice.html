<!DOCTYPE html>
<html>
<head>
    <title>Class Notice</title>
</head>
<body>

<h2>Class Notices</h2>

<p><strong>Student:</strong> {{ student.name }}</p>

<hr>

{% if notices %}
    <ul>
        {% for notice in notices %}
            <li>
                <strong>{{ notice.title }}</strong><br>
                {{ notice.message }}<br>
                <small>{{ notice.created_at }}</small>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No notices available yet.</p>
{% endif %}

<br>

<a href="{% url 'classroom:student_detail' student.pk %}">
    Back to Student Profile
</a>

</body>
</html>
