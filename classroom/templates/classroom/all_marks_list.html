<!DOCTYPE html>
<html>
<head>
    <title>All Marks</title>
</head>
<body>

<h2>Student Marks</h2>

<!-- safer than view.kwargs.pk -->
<h3>Student: {{ marks.0.student.name }}</h3>

{% if marks %}
    <table border="1" cellpadding="10">
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
        </tr>

        {% for mark in marks %}
        <tr>
            <td>{{ mark.subject }}</td>
            <td>{{ mark.score }}</td>
            <td>{{ mark.grade }}</td>
        </tr>
        {% endfor %}
    </table>
{% else %}
    <p>No marks available for this student.</p>
{% endif %}

<br>
<a href="{% url 'classroom:students_list' %}">Back to Students</a>

</body>
</html>
