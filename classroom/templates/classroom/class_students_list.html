<!DOCTYPE html>
<html>
<head>
    <title>Class Students</title>
</head>
<body>

<h2>My Class Students</h2>

{% if class_students_list %}
    <ul>
        {% for student in class_students_list %}
            <li>
                <a href="{% url 'classroom:student_detail' student.pk %}">
                    {{ student.name }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No students found.</p>
{% endif %}

</body>
</html>
